name: Build macOS DMG (Fork Release)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag for the release (e.g. introdb-v1)'
        required: true
        type: string
      release_name:
        description: 'Release title shown on GitHub'
        required: false
        type: string
        default: 'Plezy macOS (IntroDB build)'

permissions:
  contents: write

env:
  GIT_COMMIT_DART_DEFINE: --dart-define=GIT_COMMIT=${{ github.sha }}
  DONATIONS_DART_DEFINE: --dart-define=ENABLE_DONATIONS=false

jobs:
  build-macos-dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true
          pub-cache: false

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Build macOS (unsigned)
        run: |
          flutter build macos --release \
            --dart-define=ENABLE_UPDATE_CHECK=false \
            ${{ env.GIT_COMMIT_DART_DEFINE }} \
            ${{ env.DONATIONS_DART_DEFINE }}

      - name: Ad-hoc sign for local use
        run: |
          codesign --force --deep --sign - build/macos/Build/Products/Release/Plezy.app

      - name: Create DMG
        run: |
          mkdir -p dmg-staging
          cp -R build/macos/Build/Products/Release/Plezy.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -format ULMO -srcfolder dmg-staging -volname "Plezy" plezy-macos.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: plezy-macos.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
